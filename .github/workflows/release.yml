name: Release

# Nightly release train: if main changed since the last tag, compute the next semver from
# conventional commits, create the tag + a GitHub Release (the changelog), and deploy it via the
# reusable deploy workflow -- to STAGING first, then to PRODUCTION with the same image digest (#171).
# Fully automatic; each deploy self-rolls-back on a failed smoke test, and a staging failure stops
# production.
#
# WHY STAGING FIRST, stated precisely because the obvious reason is the weak one. The main reason is
# that staging stays CURRENT: it was reachable only by manual dispatch and drifted 22 days behind,
# where a configuration change was accepted, rolled a Healthy revision and did nothing, because the
# code that reads it had not reached that image. The pre-production gate is a small side-effect:
# staging shares production's CAE, identity, Key Vault and Vitally tenant, so its smoke is the same
# set production's own deploy runs and self-rolls-back on. It saves a few minutes of a broken
# production revision at 02:00 UTC. It catches no functional regression -- those need a real token.
#
# STAGING IS SKIPPED, NOT FAILED, in two cases, and production still ships:
#   * it is torn down (#112 -- on-demand, so absence is normal). The gate (staging-gate.yml) asks
#     check-serving-revisions.sh, whose exit 3 means az said the app does not exist. Any other
#     failure -- a lapsed login, a missing role, an Azure outage -- FAILS the train rather than
#     skipping, because reading "could not check" as "absent" is the fail-open shape #167 removed.
#     Absence is only observable because the deploy identity holds ContainerApp Reader at
#     resource-group scope; without it Azure answers AuthorizationFailed for a missing app.
#   * it is PINNED: the `STAGING_PINNED` variable on the `staging` GitHub environment is non-empty,
#     and its value is the reason. Staging exists to run the next identity change ahead of
#     production (it ran Entra from 2026-09-03 while production waited until 2026-09-16), and a
#     nightly deploy of the tag would overwrite a branch mid-validation.
#     ⚠️ THIS IS NOT THE AUTO_DEPLOY PATTERN warned against below. That released without deploying
#     anywhere; a pin skips STAGING only, and production still ships what was tagged. A pinned
#     staging is by definition not current, so the notice repeats every night rather than once.
#
# TO FREEZE DEPLOYS: `gh workflow disable release.yml`; to lift it, `gh workflow enable release.yml`.
# That stops tagging, releasing and deploying together, which is the coherent unit — a freeze must not
# be able to leave a Release behind for something that never shipped.
#
# Nothing is lost by pausing: the commits stay on main, and whenever the train next runs it tags once
# and `--generate-notes` builds the changelog from everything since the previous tag. #111 briefly
# added an AUTO_DEPLOY variable to keep tagging during a freeze, on the mistaken premise that a freeze
# discarded changelog history. It does not — and the one night that ran produced v4.2.2: a Release
# marked "Latest" that had been deployed nowhere. Reverted in #115; don't reintroduce it.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly
  workflow_dispatch:

# Permissions are set per-job: a reusable workflow's token is CAPPED by the caller, so the deploy
# job must itself grant id-token/packages or the called deploy.yml would be denied them at runtime.
concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  release:
    name: Cut version + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + GitHub Release
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and create tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          custom_release_rules: "feat:minor,fix:patch,build:patch,ci:patch,chore:patch,refactor:patch,perf:patch"

      - name: Create GitHub Release
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          gh release create "$NEW_TAG" --generate-notes --latest

  # Decides whether staging takes this tag: deploy, skip (pinned or torn down), or FAIL when it cannot
  # tell. See staging-gate.yml.
  staging-gate:
    needs: release
    if: ${{ needs.release.outputs.new_tag != '' }}
    permissions:
      id-token: write # OIDC for azure/login in the called gate
      contents: read
    uses: ./.github/workflows/staging-gate.yml
    with:
      ref: ${{ needs.release.outputs.new_tag }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-staging:
    needs: [release, staging-gate]
    if: ${{ needs.staging-gate.outputs.deploy == 'true' }}
    permissions:
      id-token: write # OIDC for azure/login in the called deploy
      contents: read
      packages: write # GHCR push in the called deploy
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
      ref: ${{ needs.release.outputs.new_tag }}
      image_tag: ${{ needs.release.outputs.new_tag }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Production ships when the gate SUCCEEDED and staging did what the gate decided: deployed
  # successfully when the gate said deploy, or was skipped when it said not to. Pairing the two, rather
  # than accepting `success || skipped` alone, means a staging job skipped for any OTHER reason cannot
  # wave production through. The default `needs` semantics would skip this whenever deploy-staging is
  # skipped, and `!cancelled()` is what lets it run at all in that case. A gate failure (could not
  # assess), a staging failure or a cancellation stops it.
  #
  # When staging deployed, production takes staging's DIGEST and skips the build, so both targets run
  # one image. When staging was skipped, `image_digest` is empty and production builds as it always did.
  deploy:
    needs: [release, staging-gate, deploy-staging]
    if: >-
      ${{ !cancelled()
          && needs.release.outputs.new_tag != ''
          && needs.staging-gate.result == 'success'
          && ((needs.staging-gate.outputs.deploy == 'true' && needs.deploy-staging.result == 'success')
              || (needs.staging-gate.outputs.deploy == 'false' && needs.deploy-staging.result == 'skipped')) }}
    permissions:
      id-token: write # OIDC for azure/login in the called deploy
      contents: read
      packages: write # GHCR push in the called deploy
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.new_tag }}
      image_tag: ${{ needs.release.outputs.new_tag }}
      image_digest: ${{ needs.deploy-staging.outputs.image_digest }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
