name: Staging gate

# Decides whether the release train deploys this tag to staging (#171). Called by release.yml; a
# separate reusable workflow so its three verdicts can be exercised without running the train.
#
#   deploy=true    staging exists and every serving revision could be read
#   deploy=false   staging is PINNED (STAGING_PINNED is non-empty -- its value is the reason) or
#                  TORN DOWN (check-serving-revisions.sh exit 3: az said the app does not exist)
#   job FAILS      anything else -- a lapsed login, a missing role, an Azure outage, a malformed
#                  listing. Reading "could not check" as "absent" is the fail-open shape #167 removed,
#                  and it would ship production on an assumption, so the train stops instead.
#
# Absence is only observable because the deploy identity holds ContainerApp Reader at resource-group
# scope (infra/terraform/identity.tf): without it Azure answers AuthorizationFailed for an app that
# does not exist, identical to a lost role.
on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to take check-serving-revisions.sh from (the tag being released)"
        required: true
        type: string
      container_app:
        # Empty in real use: the staging environment's CONTAINER_APP. Overridable so the torn-down
        # path can be proven against a name that does not exist without tearing staging down.
        description: "Container App to look for (default: the staging environment's CONTAINER_APP)"
        required: false
        type: string
    outputs:
      deploy:
        description: "'true' to deploy to staging, 'false' to skip it"
        value: ${{ jobs.gate.outputs.deploy }}
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  gate:
    name: Is staging up and unpinned?
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for azure/login
      contents: read
    # The staging credential -- the federated subject is per environment -- but NO deployment record:
    # nothing is deployed here, and a phantom staging deployment every night would make the
    # environment's history lie. Verified to record none (#171).
    environment:
      name: staging
      deployment: false
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    env:
      PINNED: ${{ vars.STAGING_PINNED }}
      CONTAINER_APP: ${{ inputs.container_app || vars.CONTAINER_APP }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
    steps:
      # A pin needs no Azure at all, so it is decided before login: a pinned staging then cannot be
      # blocked by an unrelated Azure failure.
      - name: Checkout repository
        if: ${{ env.PINNED == '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Azure login (OIDC)
        if: ${{ env.PINNED == '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Decide
        id: decide
        run: |
          set -uo pipefail
          if [ -n "$PINNED" ]; then
            echo "::notice title=Staging PINNED, not deployed::$PINNED -- staging is NOT current while the pin is set. Production still deploys. Delete STAGING_PINNED on the staging environment to resume."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CONTAINER_APP" ] || [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::CONTAINER_APP / RESOURCE_GROUP are not set for the staging environment"
            exit 1
          fi
          az config set extension.use_dynamic_install=yes_without_prompt > /dev/null 2>&1
          bash .github/scripts/check-serving-revisions.sh "$CONTAINER_APP" "$RESOURCE_GROUP" --image
          rc=$?
          case "$rc" in
            0) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "::notice title=Staging torn down, not deployed::$CONTAINER_APP does not exist in $RESOURCE_GROUP. Production still deploys."
               echo "deploy=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not establish whether staging is up (check-serving-revisions exit $rc). Failing rather than skipping: an auth or Azure failure is not absence."
               exit 1 ;;
          esac
