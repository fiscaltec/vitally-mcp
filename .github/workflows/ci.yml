name: CI

on:
  push:
    branches:
      - main
      - csharp
  pull_request:
    branches:
      - main
  workflow_dispatch:

# dorny/test-reporter publishes a Check Run for the test summary; that requires
# checks: write on top of the read-only defaults.
permissions:
  contents: read
  checks: write
  actions: read

# Cancel any in-flight CI run when a new push lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (ubuntu-latest, net10.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore VitallyMcp.sln

      - name: Build (Release)
        run: dotnet build VitallyMcp.sln --configuration Release --no-restore --nologo

      # xunit.v3 4.x runs on Microsoft.Testing.Platform, not VSTest (see global.json). On the
      # .NET 10 SDK the MTP options are first-class `dotnet test` flags, so they take no `--`
      # separator — and the VSTest-only `--nologo`, `--verbosity`, `--logger` and `--collect`
      # are rejected outright rather than ignored.
      - name: Run tests with coverage
        run: >
          dotnet test VitallyMcp.sln
          --configuration Release
          --no-build
          --report-trx
          --report-trx-filename test-results.trx
          --results-directory TestResults
          --coverage
          --coverage-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: xUnit tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true
