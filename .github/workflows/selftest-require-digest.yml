name: Self-test require_image_digest (temporary, #171)

# TEMPORARY -- deleted before merge. Calls deploy.yml the way a broken output chain would: digest
# required, digest empty. Expect "Resolve the image digest" to FAIL with the GHCR login and build
# SKIPPED, and nothing after it (no Azure login, no import, no roll) to run. Deploys nothing.
on:
  push:
    branches:
      - ci/staging-first-release-train
    paths:
      - .github/workflows/selftest-require-digest.yml

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  call:
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
      ref: ${{ github.sha }}
      image_tag: selftest-require-digest
      image_digest: ""
      require_image_digest: true
    secrets: inherit
