name: Probe staging presence (temporary, #171)

# TEMPORARY evidence-gathering workflow for #171 -- deleted before the PR is opened. Deploys nothing
# and changes nothing: every az call is a read. It answers one question: what does the DEPLOY
# identity (which holds Contributor scoped to each Container App, and nothing at resource-group
# scope) see when it looks up a Container App that does not exist?
on:
  push:
    branches:
      - ci/staging-first-release-train
    paths:
      - .github/workflows/probe-staging-presence.yml

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Probe
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          CA: ${{ vars.CONTAINER_APP }}
        run: |
          set -u +e
          az config set extension.use_dynamic_install=yes_without_prompt > /dev/null 2>&1
          probe() { echo "::group::$1"; shift; "$@"; echo "exit=$?"; echo "::endgroup::"; }
          probe "1 revision list, REAL staging app" az containerapp revision list -n "$CA" -g "$RG" --query '[].name' -o tsv
          probe "2 revision list, NONEXISTENT app" az containerapp revision list -n vitally-nonexistent-ca-uksouth -g "$RG" -o json
          probe "3 containerapp show, NONEXISTENT app" az containerapp show -n vitally-nonexistent-ca-uksouth -g "$RG" -o json
          probe "4 containerapp list, whole RG" az containerapp list -g "$RG" --query '[].name' -o tsv
          probe "5 script, REAL staging" bash .github/scripts/check-serving-revisions.sh "$CA" "$RG" --image
          probe "6 script, NONEXISTENT app" bash .github/scripts/check-serving-revisions.sh vitally-nonexistent-ca-uksouth "$RG" --image
          mkdir -p /tmp/emptyaz
          probe "7 script, BROKEN login" env AZURE_CONFIG_DIR=/tmp/emptyaz bash .github/scripts/check-serving-revisions.sh "$CA" "$RG" --image
