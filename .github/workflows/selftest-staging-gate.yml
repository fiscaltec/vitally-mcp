name: Self-test staging gate (temporary, #171)

# TEMPORARY -- deleted before the PR opens. Deploys nothing. Two halves:
#
# 1. The REAL staging-gate.yml, called three ways: against the live staging app (expect deploy=true),
#    against a nonexistent app name (expect deploy=false, the torn-down path), and with a bogus client
#    id (expect the gate to FAIL -- a broken login must never read as absent).
# 2. release.yml's production `if:` expression, evaluated by GitHub itself over stub jobs for the
#    four gate/staging outcomes. The expression is copied with the job ids renamed per scenario --
#    a copy, so it is kept textually identical apart from the ids; the real train run then confirms
#    the real one.
on:
  push:
    branches:
      - ci/staging-first-release-train
    paths:
      - .github/workflows/selftest-staging-gate.yml
      - .github/workflows/staging-gate.yml
      - .github/scripts/check-serving-revisions.sh

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. the real gate

  gate-present:
    uses: ./.github/workflows/staging-gate.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  gate-absent:
    uses: ./.github/workflows/staging-gate.yml
    with:
      ref: ${{ github.sha }}
      container_app: vitally-nonexistent-ca-uksouth
    secrets: inherit

  gate-broken-login:
    uses: ./.github/workflows/staging-gate.yml
    with:
      ref: ${{ github.sha }}
    secrets:
      AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  assert-gate:
    needs: [gate-present, gate-absent, gate-broken-login]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          P_RES: ${{ needs.gate-present.result }}
          P_OUT: ${{ needs.gate-present.outputs.deploy }}
          A_RES: ${{ needs.gate-absent.result }}
          A_OUT: ${{ needs.gate-absent.outputs.deploy }}
          B_RES: ${{ needs.gate-broken-login.result }}
          B_OUT: ${{ needs.gate-broken-login.outputs.deploy }}
        run: |
          rc=0
          chk() { if [ "$2" = "$3" ]; then echo "ok   $1: $2"; else echo "FAIL $1: got '$2', want '$3'"; rc=1; fi; }
          chk "present  result" "$P_RES" success;  chk "present  deploy" "$P_OUT" true
          chk "absent   result" "$A_RES" success;  chk "absent   deploy" "$A_OUT" false
          chk "broken   result" "$B_RES" failure;  chk "broken   deploy" "$B_OUT" ""
          exit $rc

  # ---------------------------------------------------------------- 2. the production condition

  s1-gate: { runs-on: ubuntu-latest, outputs: { deploy: "${{ steps.o.outputs.deploy }}" }, steps: [ { id: o, run: echo deploy=true >> "$GITHUB_OUTPUT" } ] }
  s1-staging: { needs: s1-gate, if: "${{ needs.s1-gate.outputs.deploy == 'true' }}", runs-on: ubuntu-latest, steps: [ { run: "true" } ] }
  s1-prod:
    needs: [s1-gate, s1-staging]
    if: >-
      ${{ !cancelled()
          && needs.s1-gate.result == 'success'
          && ((needs.s1-gate.outputs.deploy == 'true' && needs.s1-staging.result == 'success')
              || (needs.s1-gate.outputs.deploy == 'false' && needs.s1-staging.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps: [ { run: "true" } ]

  s2-gate: { runs-on: ubuntu-latest, outputs: { deploy: "${{ steps.o.outputs.deploy }}" }, steps: [ { id: o, run: echo deploy=true >> "$GITHUB_OUTPUT" } ] }
  s2-staging: { needs: s2-gate, if: "${{ needs.s2-gate.outputs.deploy == 'true' }}", runs-on: ubuntu-latest, steps: [ { run: "false" } ] }
  s2-prod:
    needs: [s2-gate, s2-staging]
    if: >-
      ${{ !cancelled()
          && needs.s2-gate.result == 'success'
          && ((needs.s2-gate.outputs.deploy == 'true' && needs.s2-staging.result == 'success')
              || (needs.s2-gate.outputs.deploy == 'false' && needs.s2-staging.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps: [ { run: "true" } ]

  s3-gate: { runs-on: ubuntu-latest, outputs: { deploy: "${{ steps.o.outputs.deploy }}" }, steps: [ { id: o, run: echo deploy=false >> "$GITHUB_OUTPUT" } ] }
  s3-staging: { needs: s3-gate, if: "${{ needs.s3-gate.outputs.deploy == 'true' }}", runs-on: ubuntu-latest, steps: [ { run: "true" } ] }
  s3-prod:
    needs: [s3-gate, s3-staging]
    if: >-
      ${{ !cancelled()
          && needs.s3-gate.result == 'success'
          && ((needs.s3-gate.outputs.deploy == 'true' && needs.s3-staging.result == 'success')
              || (needs.s3-gate.outputs.deploy == 'false' && needs.s3-staging.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps: [ { run: "true" } ]

  s4-gate: { runs-on: ubuntu-latest, outputs: { deploy: "${{ steps.o.outputs.deploy }}" }, steps: [ { id: o, run: "false" } ] }
  s4-staging: { needs: s4-gate, if: "${{ needs.s4-gate.outputs.deploy == 'true' }}", runs-on: ubuntu-latest, steps: [ { run: "true" } ] }
  s4-prod:
    needs: [s4-gate, s4-staging]
    if: >-
      ${{ !cancelled()
          && needs.s4-gate.result == 'success'
          && ((needs.s4-gate.outputs.deploy == 'true' && needs.s4-staging.result == 'success')
              || (needs.s4-gate.outputs.deploy == 'false' && needs.s4-staging.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps: [ { run: "true" } ]

  assert-condition:
    needs: [s1-prod, s2-prod, s3-prod, s4-prod]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          S1: ${{ needs.s1-prod.result }}
          S2: ${{ needs.s2-prod.result }}
          S3: ${{ needs.s3-prod.result }}
          S4: ${{ needs.s4-prod.result }}
        run: |
          rc=0
          chk() { if [ "$2" = "$3" ]; then echo "ok   $1: prod $2"; else echo "FAIL $1: prod $2, want $3"; rc=1; fi; }
          chk "S1 gate=deploy, staging ok        " "$S1" success
          chk "S2 gate=deploy, staging FAILED    " "$S2" skipped
          chk "S3 gate=skip (pinned/torn down)   " "$S3" success
          chk "S4 gate FAILED (could not assess) " "$S4" skipped
          exit $rc
